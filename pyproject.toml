[project]
name = "ticket-agent"
version = "0.1.0"
description = "A print-shop job ticket agent that a customer email can't push to the press."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "boto3>=1.44"]
infra = ["aws-cdk-lib>=2.200", "constructs>=10", "boto3>=1.44"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
