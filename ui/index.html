<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Agent Console</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#16181d; --muted:#626a77; --line:#e3e6eb; --soft:#f0f2f5;
  --accent:#2f5bd3; --accent-ink:#ffffff;
  --ok:#1f7a4d; --ok-bg:#e6f4ec; --warn:#9a5b00; --warn-bg:#fdf1dc; --bad:#b42318; --bad-bg:#fde8e6;
  --info:#3a4a8f; --info-bg:#e9edfb; --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --panel:#171a20; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2a2f38; --soft:#1e222a;
    --accent:#7b9bff; --accent-ink:#0f1115; --ok:#5fd49a; --ok-bg:#13291f; --warn:#f0b75a; --warn-bg:#2d2312;
    --bad:#ff8a80; --bad-bg:#331816; --info:#a9b6ff; --info-bg:#1c2240; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:650}
header .sub{color:var(--muted);font-size:13px}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink)}
button.stat{cursor:pointer;font-size:12px;padding:4px 10px}
button.stat:hover{border-color:var(--accent);color:var(--ink)}
button.stat.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.stat.on b{color:var(--accent-ink)}
.qfilter{font-size:11px;text-transform:none;letter-spacing:0;color:var(--accent);margin-left:6px}
main{display:grid;grid-template-columns:300px 320px 1fr;gap:12px;padding:12px;height:calc(100vh - 58px - 190px);min-height:520px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
section>h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.list{overflow:auto;flex:1}
.row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--soft)} .row.sel{background:var(--info-bg)}
.row .t{font-weight:600;font-size:13px} .row .m{color:var(--muted);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{font-size:11px;padding:3px 8px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.s-DRAFT{background:var(--info-bg);color:var(--info)} .s-REFUSED{background:var(--bad-bg);color:var(--bad)}
.s-IN_REVIEW,.s-PROOF_SENT{background:var(--warn-bg);color:var(--warn)} .s-APPROVED,.s-RELEASED{background:var(--ok-bg);color:var(--ok)}
.k-attack{background:var(--bad-bg);color:var(--bad)} .k-benign,.k-baseline,.k-sample{background:var(--ok-bg);color:var(--ok)} .k-edge{background:var(--warn-bg);color:var(--warn)}
.detail{overflow:auto;padding:16px 18px;flex:1}
.empty{color:var(--muted);padding:30px;text-align:center}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dhead h3{margin:0;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--panel)}
.card h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:30%}
.src{font-family:var(--mono);font-size:11px;color:var(--muted)}
.price{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.flag{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;margin-bottom:6px;font-size:12.5px}
.f-block{background:var(--bad-bg);color:var(--bad)} .f-warn{background:var(--warn-bg);color:var(--warn)} .f-note{background:var(--soft);color:var(--muted)}
.flag code{font-family:var(--mono);font-weight:700;white-space:nowrap}
.steps{display:flex;gap:6px;margin:16px 0 10px;flex-wrap:wrap}
.step{flex:1;min-width:90px;text-align:center;font-size:12px;padding:7px 4px;border-radius:7px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.step.done{background:var(--ok-bg);color:var(--ok);border-color:transparent} .step.now{background:var(--info-bg);color:var(--info);border-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reply{white-space:pre-wrap;font-size:12.5px;max-height:220px;overflow:auto;background:var(--soft);border-radius:7px;padding:10px}
.mismatch{color:var(--bad);font-weight:600;font-size:12.5px;margin-top:6px}
.bottom{margin:0 12px 12px;height:170px}
.log{font-family:var(--mono);font-size:11.5px;overflow:auto;flex:1;padding:4px 0}
.log div{padding:3px 14px;display:flex;gap:10px;border-bottom:1px solid var(--line)}
.log .deny{color:var(--bad)} .log .allow{color:var(--muted)} .log .mm{color:var(--warn)}
.log .ctl{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:0 5px}
.toast{position:fixed;right:18px;bottom:200px;max-width:440px;background:var(--ink);color:var(--panel);padding:12px 14px;border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:13px;display:none;z-index:9}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.emailbox{white-space:pre-wrap;font-size:12.5px;background:var(--soft);border-radius:7px;padding:10px;max-height:180px;overflow:auto}
@media (max-width: 1100px){ main{grid-template-columns:1fr;height:auto} .grid2,.vs{grid-template-columns:1fr} .bottom{height:220px} }
</style>
</head>
<body>
<header>
  <div>
    <h1>Ticket Agent · Estimator console</h1>
    <div class="sub">A customer email can't print itself. The agent drafts; people approve; only the release gate writes to the press.</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section>
    <h2>Inbox <span class="tabs"><button data-f="all" class="on">All</button><button data-f="benign">Normal</button><button data-f="attack">Attacks</button></span></h2>
    <div class="list" id="inbox"></div>
  </section>
  <section>
    <h2>Ticket queue <span class="qfilter" id="qfilter"></span><span class="tabs"><button id="refresh">Refresh</button></span></h2>
    <div class="list" id="queue"></div>
  </section>
  <section>
    <h2 id="dtitle">Details</h2>
    <div class="detail" id="detail"><div class="empty">Pick an email to send to the agent, or a ticket to review.</div></div>
  </section>
</main>

<section class="bottom">
  <h2>Audit trail · which layer allowed or denied what</h2>
  <div class="log" id="audit"></div>
</section>
<div class="toast" id="toast"></div>

<script>
const S = { inbox: [], tickets: [], customers: {}, filter: "all", qstatus: null, hotfolders: [], sel: null, runs: {}, proofs: {}, busy: false };
const STAT_CHIPS = [["DRAFT", "Drafts awaiting review"], ["REFUSED", "Refused"], ["APPROVED", "Approved"], ["RELEASED", "Released"]];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (c) => c == null ? "—" : "$" + (c / 100).toLocaleString(undefined, {minimumFractionDigits: 2});
const BLOCK = ["MISSING_", "UNPRICEABLE", "SENDER_", "LOOKALIKE_", "DUE_DATE_PAST", "GUARDRAIL_DENIED", "PROHIBITED"];
const WARN = ["INJECTION", "GUARDRAIL", "MENTIONS_OTHER", "REPLY_TO", "RUSH", "UNUSUAL", "DISCOUNT"];
const fclass = (code) => BLOCK.some(p => code.startsWith(p)) ? "f-block" : WARN.some(p => code.startsWith(p)) ? "f-warn" : "f-note";

async function api(path, body) {
  const r = await fetch("/api/" + path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, kind = "") {
  const t = $("toast"); t.className = "toast " + kind; t.innerHTML = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 6500);
}
function denyMsg(r) { return `<b>Denied</b> · ${esc(r.rule)} · <code>${esc(r.control)}</code><br>${esc(r.reason)}`; }

async function load() {
  const [tickets, audit, hf, customers] = await Promise.all([api("tickets"), api("audit"), api("hotfolders"), api("customers")]);
  S.tickets = tickets; S.customers = customers; S.hotfolders = hf;
  renderStats(); renderQueue(); renderAudit(audit);
  if (S.sel && S.sel.type === "ticket") renderTicket(S.sel.id);
  if (S.sel && S.sel.type === "hotfolders") renderHotfolders();
}

function renderStats() {
  const live = S.tickets.filter(t => t.source_email_id !== "archive");
  const n = (st) => live.filter(t => t.status === st).length;
  $("stats").innerHTML = STAT_CHIPS.map(([st, label]) =>
      `<button class="stat ${S.qstatus === st ? "on" : ""}" data-stat="${st}" title="Show only ${label.toLowerCase()} tickets">${label} <b>${n(st)}</b></button>`).join("")
    + `<button class="stat ${S.sel?.type === "hotfolders" ? "on" : ""}" data-hot="1" title="Show the job files the release gate wrote">Files in hot folders <b>${S.hotfolders.length}</b></button>`;
  const label = STAT_CHIPS.find(([st]) => st === S.qstatus)?.[1];
  $("qfilter").innerHTML = label ? `· ${esc(label)} <button data-stat="" style="font-size:11px;padding:1px 6px">✕ clear</button>` : "";
}

function renderHotfolders() {
  $("dtitle").textContent = "Hot folders";
  const byDevice = {};
  S.hotfolders.forEach(f => (byDevice[f.key.split("/")[0]] ||= []).push(f));
  $("detail").innerHTML = `
    <div class="dhead"><h3>Hot folders</h3><span class="m">Only the release Lambda can write here (S3 bucket policy denies everyone else).</span></div>
    ${Object.keys(byDevice).length ? Object.entries(byDevice).map(([dev, files]) => `
      <div class="card" style="margin-top:14px"><h4>${esc(dev)}</h4><table>
        ${files.map(f => {
          const tid = (f.key.split("/")[1] || "").split("-v")[0];
          return `<tr><td><span class="src">${esc(f.key)}</span></td><td>${new Date(f.at).toLocaleString()} · ${f.size} bytes
            ${S.tickets.some(t => t.ticket_id === tid) ? ` · <button data-ticket="${esc(tid)}" style="font-size:11px;padding:1px 6px">open ${esc(tid)}</button>` : ""}</td></tr>`;
        }).join("")}
      </table></div>`).join("") : `<div class="empty">No files yet. A job lands here only after review, proof, client approval and the release gate's checks.</div>`}`;
}

function renderInbox() {
  const items = S.inbox.filter(i => S.filter === "all" || (S.filter === "attack" ? i.kind === "attack" : i.kind !== "attack"));
  $("inbox").innerHTML = items.map(i => `
    <div class="row ${S.sel?.type === "email" && S.sel.id === i.id ? "sel" : ""}" data-email="${esc(i.id)}">
      <div class="t"><span class="pill k-${esc(i.kind)}">${i.kind === "attack" ? "attack" : "normal"}</span> ${esc(i.email.subject)}</div>
      <div class="m">${esc(i.email.from_addr)}</div>
      ${i.goal ? `<div class="m">${esc(i.category)}: ${esc(i.goal)}</div>` : ""}
    </div>`).join("");
}

function renderQueue() {
  const live = S.tickets.filter(t => t.source_email_id !== "archive" && (!S.qstatus || t.status === S.qstatus));
  $("queue").innerHTML = live.map(t => {
    const c = S.customers[t.customer_id]?.company || t.customer_id;
    const fl = (t.flags || []).filter(f => fclass(f.code) !== "f-note").length;
    const what = t.status === "REFUSED" ? (t.refusal?.category || "refused") :
      `${t.specs.quantity ?? "?"} × ${(t.specs.product || "?").replace("_", " ")}`;
    return `<div class="row ${S.sel?.type === "ticket" && S.sel.id === t.ticket_id ? "sel" : ""}" data-ticket="${t.ticket_id}">
      <div class="t">${t.ticket_id} <span class="pill s-${t.status}">${t.status.replace("_", " ")}</span>
        ${fl ? `<span class="pill f-warn">${fl} flag${fl > 1 ? "s" : ""}</span>` : ""}</div>
      <div class="m">${esc(c)} · ${esc(what)} · ${money(t.price?.total_cents)}</div>
    </div>`;
  }).join("") || `<div class="empty">${S.qstatus ? "No tickets with this status." : "No tickets yet."}</div>`;
}

function renderAudit(entries) {
  $("audit").innerHTML = entries.map(e => {
    const cls = e.decision === "DENY" ? "deny" : e.decision === "MISMATCH" ? "mm" : "allow";
    const why = e.detail?.reason || (e.detail?.issues || []).join("; ") || (e.detail?.flags || []).join(", ") || e.detail?.ticket_id || "";
    return `<div class="${cls}"><span>${e.ts.slice(11, 19)}</span><span>${esc(e.actor)}</span><span>${esc(e.action)}</span>
      <span><b>${e.decision}</b></span>${e.control ? `<span class="ctl">${esc(e.rule || "")} ${esc(e.control)}</span>` : ""}<span>${esc(why).slice(0, 160)}</span></div>`;
  }).join("");
}

function renderEmail(id) {
  const i = S.inbox.find(x => x.id === id);
  const e = i.email;
  $("dtitle").textContent = "Email";
  $("detail").innerHTML = `
    <div class="dhead"><h3>${esc(e.subject)}</h3><span class="pill k-${esc(i.kind)}">${i.kind === "attack" ? "attack" : "normal"}</span></div>
    ${i.goal ? `<p class="m"><b>Attacker's goal:</b> ${esc(i.goal)}</p>` : ""}
    <table><tr><td>From</td><td>${esc(e.from_addr)}</td></tr>
      ${e.reply_to ? `<tr><td>Reply-To</td><td>${esc(e.reply_to)}</td></tr>` : ""}
      <tr><td>DKIM / DMARC</td><td>${esc(e.auth?.dkim)} / ${esc(e.auth?.dmarc)}</td></tr></table>
    <h4 style="margin:14px 0 6px;color:var(--muted);font-size:12px">BODY</h4><div class="emailbox">${esc(e.body)}</div>
    ${(e.attachments || []).map(a => `<h4 style="margin:12px 0 6px;color:var(--muted);font-size:12px">ATTACHMENT · ${esc(a.name)}</h4><div class="emailbox">${esc(a.text)}</div>`).join("")}
    <div class="actions" style="margin-top:14px"><button class="primary" id="send">Send to Ticket Agent</button></div>
    <div id="runout"></div>`;
  $("send").onclick = () => runEmail(i);
}

async function runEmail(i) {
  if (S.busy) return; S.busy = true;
  $("send").disabled = true; $("send").innerHTML = `<span class="spin"></span> Intake → Guardrails → agent → Cedar → tools…`;
  const email = JSON.parse(JSON.stringify(i.email));
  email.message_id = `${i.id}-ui-${Date.now()}`;
  try {
    const r = await api("run_email", {email});
    const saved = r.verified_outcome?.tickets_saved_this_session || [];
    (saved.length ? saved.map(t => t.ticket_id) : (r.tickets || [])).forEach(id => S.runs[id] = r);
    await load();
    const first = saved[0]?.ticket_id || (r.tickets || [])[0];
    if (first) { S.sel = {type: "ticket", id: first}; renderQueue(); renderTicket(first); }
    else { $("runout").innerHTML = `<div class="card"><h4>Result</h4><div class="reply">${esc(r.agent_reply || JSON.stringify(r, null, 2))}</div></div>`; $("send").innerHTML = "Sent"; }
    toast(r.agent_invoked === false ? `Refused at intake by <b>Bedrock Guardrails</b>. The model never ran.` :
      `Agent finished · ${saved.length} ticket(s) saved`, r.agent_invoked === false ? "bad" : "ok");
  } catch (err) { toast("Error: " + esc(err.message), "bad"); $("send").disabled = false; $("send").textContent = "Send to Ticket Agent"; }
  S.busy = false;
}

const STEPS = ["DRAFT", "IN_REVIEW", "PROOF_SENT", "APPROVED", "RELEASED"];
function renderTicket(id) {
  const t = S.tickets.find(x => x.ticket_id === id); if (!t) return;
  const c = S.customers[t.customer_id] || {};
  const run = S.runs[id]; const proof = S.proofs[id];
  $("dtitle").textContent = "Ticket";
  const idx = STEPS.indexOf(t.status);
  const specs = ["product", "quantity", "finished_size", "stock", "colors", "finishing", "due_date", "ship_to"];
  const flags = (t.flags || []);
  $("detail").innerHTML = `
    <div class="dhead"><h3>${t.ticket_id}</h3><span class="pill s-${t.status}">${t.status.replace("_", " ")}</span>
      <span class="m">v${t.version} · ${esc(c.company || t.customer_id)} · from email <code class="src">${esc(t.source_email_id)}</code></span></div>
    ${t.status === "REFUSED" ? `<div class="card" style="margin-top:14px"><h4>Refused</h4><b>${esc(t.refusal?.category)}</b> — ${esc(t.refusal?.explanation)}</div>` : `
    <div class="steps">${STEPS.map((s, i) => `<div class="step ${i < idx ? "done" : i === idx ? "now" : ""}">${s.replace("_", " ").toLowerCase()}</div>`).join("")}</div>
    <div class="actions">
      <button id="aReview" ${t.status !== "DRAFT" ? "disabled" : ""}>Estimator: mark reviewed</button>
      <button id="aProof" ${t.status !== "IN_REVIEW" ? "disabled" : ""}>Send proof to address on file</button>
      <button id="aApprove" class="primary" ${!(t.status === "PROOF_SENT" && proof) ? "disabled" : ""}>Client approves</button>
      <button id="aRelease" class="primary" ${!proof ? "disabled" : ""}>Release to press</button>
    </div>
    <div class="actions">
      <button id="xApprove" class="danger" ${!(t.status === "PROOF_SENT" && proof) ? "disabled" : ""}>Attack: approve from Reply-To address</button>
      <button id="xSwap" class="danger" ${!["APPROVED", "PROOF_SENT"].includes(t.status) ? "disabled" : ""}>Attack: change quantity after approval</button>
    </div>
    ${proof ? `<div class="src">Proof emailed to <b>${esc(proof.to)}</b> (on file) · token bound to spec hash v${proof.version}</div>` : ""}`}
    <div class="grid2">
      <div class="card"><h4>Specs and where each value came from</h4><table>
        ${specs.map(k => `<tr><td>${k.replace("_", " ")}</td><td>${esc(Array.isArray(t.specs[k]) ? t.specs[k].join(", ") : t.specs[k] ?? "—")}
          ${t.sources?.[k] ? `<div class="src">← ${esc(t.sources[k])}</div>` : ""}</td></tr>`).join("")}
      </table></div>
      <div class="card"><h4>Price (from the shop's table, not the model)</h4>
        <div class="price">${money(t.price?.total_cents)}</div>
        ${t.price ? `<div class="m">list ${money(t.price.list_cents)} · contract discount ${t.price.discount_pct}% (on file: ${c.contract_discount_pct ?? "?"}%) · ${money(t.price.unit_cents)}/unit ${t.price.rush ? "· <b>rush</b>" : ""}</div>` : `<div class="m">Not priced: missing or unknown specs.</div>`}
        <h4 style="margin-top:14px">Flags (${flags.length})</h4>
        ${flags.map(f => `<div class="flag ${fclass(f.code)}"><code>${esc(f.code)}</code><span>${esc(f.message)} <span class="src">${esc(f.rule)} · ${esc(f.raised_by)}</span></span></div>`).join("") || `<div class="m">None</div>`}
      </div>
    </div>
    ${run ? `<div class="card" style="margin-top:14px"><h4>What the agent said vs. what the database says</h4><div class="vs">
      <div><b style="font-size:12px">Agent's summary</b><div class="reply">${esc(run.agent_reply || "(no reply)")}</div></div>
      <div><b style="font-size:12px">Verified outcome (DynamoDB)</b><div class="reply">${esc(JSON.stringify(run.verified_outcome?.tickets_saved_this_session?.map(x => ({ticket: x.ticket_id, status: x.status, qty: x.specs.quantity, total: money(x.price?.total_cents)})), null, 1))}</div>
      ${(run.verified_outcome?.agent_reply_mismatch || []).map(m => `<div class="mismatch">⚠ ${esc(m)}</div>`).join("")}
      <div class="src" style="margin-top:6px">tools called: ${esc((run.tool_calls || []).map(x => x.split("___").pop()).join(" → "))}</div></div></div></div>` : ""}`;
  const act = async (btn, label, fn) => {
    const b = $(btn); if (!b) return;
    b.onclick = async () => { b.disabled = true; b.innerHTML = `<span class="spin"></span> ${label}`;
      try { await fn(); } catch (err) { toast("Error: " + esc(err.message), "bad"); } await load(); };
  };
  act("aReview", "Reviewing", async () => { const r = await api("review", {ticket_id: id}); r.denied ? toast(denyMsg(r), "bad") : toast("Marked reviewed by est-rosa", "ok"); });
  act("aProof", "Sending", async () => { const r = await api("send_proof", {ticket_id: id});
    if (r.denied) return toast(denyMsg(r), "bad");
    S.proofs[id] = {to: r.proof_email.to, token: r.proof_email.approve_token, version: r.proof_email.version};
    toast(`Proof sent to <b>${esc(r.proof_email.to)}</b> (address on file)`, "ok"); });
  act("aApprove", "Approving", async () => { const r = await api("approve", {token: S.proofs[id].token, approver_email: S.proofs[id].to});
    r.denied ? toast(denyMsg(r), "bad") : toast(`Client approved · spec hash <code>${esc(r.approved_hash.slice(0, 12))}…</code>`, "ok"); });
  act("aRelease", "Releasing", async () => { const r = await api("release", {ticket_id: id, token: S.proofs[id].token});
    r.denied ? toast(denyMsg(r), "bad") : toast(`Released to <code>${esc(r.released_to)}</code>`, "ok"); });
  act("xApprove", "Attacking", async () => { const r = await api("approve", {token: S.proofs[id].token, approver_email: "billing@quick-pay.example"});
    r.denied ? toast(denyMsg(r), "bad") : toast("Approved?!", "bad"); });
  act("xSwap", "Changing", async () => { const q = (t.specs.quantity || 1000) * 50;
    const r = await api("update", {ticket_id: id, changes: {quantity: q}});
    toast(`Quantity changed to ${q.toLocaleString()} → ticket back to <b>${esc(r.status)}</b> v${r.version}. Now try "Release to press" with the old approval.`, "bad"); });
}

document.addEventListener("click", (e) => {
  const st = e.target.closest("[data-stat]"), hot = e.target.closest("[data-hot]");
  if (st) { S.qstatus = st.dataset.stat && S.qstatus !== st.dataset.stat ? st.dataset.stat : null; renderStats(); renderQueue(); return; }
  if (hot) { S.sel = {type: "hotfolders"}; renderInbox(); renderQueue(); renderStats(); renderHotfolders(); return; }
  const em = e.target.closest("[data-email]"), tk = e.target.closest("[data-ticket]"), f = e.target.closest("[data-f]");
  if (em) { S.sel = {type: "email", id: em.dataset.email}; renderInbox(); renderQueue(); renderEmail(em.dataset.email); }
  if (tk) { S.sel = {type: "ticket", id: tk.dataset.ticket}; renderInbox(); renderQueue(); renderTicket(tk.dataset.ticket); }
  if (f) { S.filter = f.dataset.f; document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b === f)); renderInbox(); }
});
$("refresh").onclick = load;
(async () => { S.inbox = await api("inbox"); renderInbox(); await load(); })().catch(err => toast("Error: " + esc(err.message), "bad"));
</script>
</body>
