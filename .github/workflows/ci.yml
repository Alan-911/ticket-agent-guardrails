name: CI — Agent policy tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8" "boto3>=1.34"
      - name: Verify Python syntax
        run: python -m compileall -q ticket_core tests infra lambdas redteam
      - name: Run authorization and injection regression tests
        run: python -m pytest tests -q
